<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141517">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="screen on" id="sc-menu">
  <div class="menu">
    <h1>卡牌<em>对决</em></h1>
    <div class="mbtn" data-action="start-ai">单人对战 · AI<small>与电脑对战</small></div>
    <div class="mbtn" data-action="start-local">本地对战<small>同屏轮流操作</small></div>
    <div class="mbtn" data-action="open-lan">局域网对战<small>电脑与手机联机</small></div>
    <div class="mbtn" data-action="open-editor">角色与卡牌编辑<small>自定义数据，自动保存</small></div>
    <div class="mfoot">先手由真随机骰子决定 · 抽牌堆/弃牌堆参考杀戮尖塔 · 每个角色独立牌组 · 出牌带特效动画</div>
    <div class="maddr" id="maddr"></div>
  </div>
</div>

<div class="screen" id="sc-edit">
  <div class="hd"><button data-action="back-menu">← 返回</button><h1>数据编辑</h1><span class="sp"></span><span class="dim">自动保存</span></div>
  <div class="tabs">
    <button class="tab on" data-action="tab-role">角色</button>
    <button class="tab" data-action="tab-card">技能卡牌</button>
  </div>
  <div class="edit-wrap" id="edit-role">
    <div class="list" id="role-list"></div>
    <div class="form" id="role-form"></div>
  </div>
  <div class="edit-wrap" id="edit-card" style="display:none">
    <div class="list" id="card-list"></div>
    <div class="form" id="card-form"></div>
  </div>
</div>

<div class="screen" id="sc-pick">
  <div class="hd"><button data-action="back-menu">← 返回</button><h1 id="pk-title">选择角色</h1></div>
  <div class="dim" style="text-align:center;margin-bottom:12px;font-size:14px" id="lan-hint"></div>
  <div class="pick-wrap">
    <div class="slot" data-action="pick-role" data-slot="0" id="slot-0"></div>
    <div class="slot" data-action="pick-role" data-slot="1" id="slot-1"></div>
  </div>
  <div style="text-align:center"><button class="primary" id="pk-go" style="display:none" data-action="go-dice">掷骰子决定先手</button></div>
</div>

<div class="screen" id="sc-dice">
  <div class="hd"><h1>决定先手</h1></div>
  <div class="dice">
    <div><div class="die" id="die-0">·</div><div style="text-align:center;margin-top:10px" id="dice-name0"></div></div>
    <div class="dim" style="font-size:28px;padding-top:20px">VS</div>
    <div><div class="die" id="die-1">·</div><div style="text-align:center;margin-top:10px" id="dice-name1"></div></div>
  </div>
  <div style="text-align:center;color:var(--acc);font-size:16px" id="dice-msg">掷骰中…</div>
</div>

<div class="screen" id="sc-lan">
  <div class="hd"><button data-action="back-menu">← 返回</button><h1>局域网对战</h1></div>
  <div style="max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:12px">
    <p class="dim" style="font-size:12px">本机服务器已内置。电脑端填 <code>http://127.0.0.1:8788</code>，手机等设备填下方本机地址，同一 WiFi 即可联机。</p>
    <div class="maddr" style="font-size:15px" id="lan-addr"></div>
    <div class="frow"><label>服务器</label><input id="lan-url" value=""></div>
    <div style="display:flex;gap:8px">
      <button class="primary" style="flex:1" data-action="lan-create">创建房间</button>
      <button style="flex:1" data-action="lan-join">手动输入房间号</button>
    </div>
    <div class="frow" id="lan-join-row" style="display:none"><label>房间号</label><input id="lan-room"><button data-action="lan-join">加入</button></div>
    <div class="lan-rooms">
      <div class="lr-hd">可加入的房间<span class="dim" style="font-size:11px;font-weight:400">自动刷新</span></div>
      <div id="room-list"><div class="dim" style="padding:12px;text-align:center">刷新中…</div></div>
    </div>
    <div id="lan-info" class="dim" style="text-align:center"></div>
  </div>
</div>

<div class="screen" id="sc-battle">
  <div class="hd"><button data-action="quit-battle">← 退出</button><h1 id="bt-title">对战</h1><span class="sp"></span><span id="bt-turn" class="dim"></span></div>
  <div class="battle-grid">
    <div class="pzone" id="pzone-up"></div>
    <div class="log" id="battle-log"></div>
    <div class="pzone" id="pzone-dn"></div>
  </div>
</div>

<div id="fx-layer"><div id="fly-card"></div></div>
<div id="modal"><div class="mback" data-action="close-modal"></div><div class="mbox" id="mbox"></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
