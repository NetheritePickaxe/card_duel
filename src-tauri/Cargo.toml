[package]
name = "card-duel"
version = "1.0.0"
description = "Card Duel Game"
authors = []
license = ""
edition = "2021"
rust-version = "1.75"
default-run = "card-duel"

[lib]
name = "card_duel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "card-duel-server"
path = "src/bin/server.rs"

[[bin]]
name = "card-duel"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["tauri", "tauri-plugin-shell"]
tls = ["tiny_http/ssl", "openssl"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rand = "0.8"
flate2 = "1"
openssl = { version = "0.10", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = [], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]

[profile.dev]
opt-level = 0
debug = true
strip = false
lto = false
panic = "abort"

[profile.release]
opt-level = 1
debug = false
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1
