[package]
name = "card-duel"
version = "1.0.0"
description = "Card Duel Game"
authors = []
license = ""
edition = "2021"
rust-version = "1.75"

[lib]
name = "card_duel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
rand = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]

[profile.dev]
opt-level = 0
debug = true
strip = false
lto = false
panic = "abort"

[profile.release]
opt-level = 1
debug = false
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1