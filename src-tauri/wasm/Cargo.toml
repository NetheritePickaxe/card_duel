[package]
name = "card-duel-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1