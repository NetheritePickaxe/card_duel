name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: JS syntax check
        run: |
          for f in app/js/*.js; do
            node --check "$f" || exit 1
          done

  build-server:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build server (no frontend)
        working-directory: src-tauri
        run: cargo build --release --no-default-features
      - name: Prepare artifacts
        run: |
          cp src-tauri/target/release/card-duel card-duel-linux
          cat > run.sh << 'EOF'
          #!/bin/sh
          DIR=$(dirname "$0")
          exec "$DIR/card-duel" --server
          EOF
          chmod +x run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: card-duel-server
          path: |
            card-duel-linux
            run.sh

  build-windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm deps
        run: npm install
      - name: Build Tauri (Windows)
        run: npx tauri build
      - name: Prepare artifacts
        shell: bash
        run: |
          cp src-tauri/target/release/card-duel.exe card-duel-win.exe
          cat > run.bat << 'EOF'
          @echo off
          "%~dp0card-duel.exe" --server
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: CardDuel-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            card-duel-win.exe
            run.bat

  build-android:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          ndk: '25.2.9519653'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install npm deps
        run: npm install
      - name: Init Android project
        run: npx tauri android init
      - name: Build Android APK
        run: npx tauri android build
      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android.keystore
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | head -1)
          "$SIGNER" sign \
            --ks android.keystore \
            --ks-key-alias cardduel \
            --ks-pass pass:$ANDROID_SIGNING_PASSWORD \
            --key-pass pass:$ANDROID_SIGNING_PASSWORD \
            --out CardDuel-Android.apk \
            "$APK"
          rm -f android.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: CardDuel-Android
          path: CardDuel-Android.apk

  deploy-pages:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build-server, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CardDuel-Windows/*.exe
            CardDuel-Windows/run.bat
            CardDuel-Android/CardDuel-Android.apk
            card-duel-server/card-duel-linux
            card-duel-server/run.sh