name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: JS syntax check
        run: |
          for f in app/js/*.js; do
            node --check "$f" || exit 1
          done
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  build-web-linux:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/wasm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.127
      - name: Build WASM engine
        run: |
          cd src-tauri/wasm
          cargo build --release --target wasm32-unknown-unknown --lib
          wasm-bindgen --target web --out-dir "../../app/js" \
            "target/wasm32-unknown-unknown/release/card_duel_wasm.wasm"
      - name: Build Linux server
        working-directory: src-tauri
        run: |
          cargo build --release --no-default-features --bin card-duel-server --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/card-duel-server card-duel-server
      - uses: actions/upload-artifact@v7
        with:
          name: CardDuel-Web-linux
          path: |
            card-duel-server
            app/cardduel.sh
            app/

  build-web-win:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/wasm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.127
      - name: Build WASM engine
        run: |
          cd src-tauri/wasm
          cargo build --release --target wasm32-unknown-unknown --lib
          wasm-bindgen --target web --out-dir "../../app/js" `
            "target\wasm32-unknown-unknown\release\card_duel_wasm.wasm"
      - name: Build Windows server
        working-directory: src-tauri
        run: |
          cargo build --release --no-default-features --bin card-duel-server
          Copy-Item "target\release\card-duel-server.exe" "card-duel-server.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: CardDuel-Web-win
          path: |
            card-duel-server.exe
            app/cardduel.bat
            app/

  build-windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm deps
        run: npm install
      - name: Build Tauri (Windows)
        run: npx tauri build
      - name: Prepare artifacts
        shell: bash
        run: |
          cp src-tauri/target/release/card-duel.exe card-duel-win.exe
          cat > cardduel.bat << 'EOF'
          @echo off
          "%~dp0card-duel.exe" --server
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: CardDuel-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            card-duel-win.exe
            cardduel.bat

  build-android:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install npm deps
        run: npm install
      - name: Init Android project
        run: npx tauri android init
      - name: Generate gradle settings
        working-directory: src-tauri
        run: |
          cargo metadata --format-version=1 > /tmp/meta.json
          python3 - <<'EOF'
          import json, subprocess, os
          meta = json.load(open('/tmp/meta.json'))
          pkgs = {p['name']: p for p in meta['packages']}
          def gradle_path(crate):
              p = pkgs[crate]
              d = os.path.dirname(p['manifest_path'])
              for cand in ['mobile/android', 'android']:
                  if os.path.isdir(os.path.join(d, cand)):
                      return os.path.join(d, cand)
              raise SystemExit(f"No android dir for {crate}")
          proj_map = {'tauri': 'tauri-android', 'tauri-plugin-shell': 'tauri-plugin-shell'}
          lines = ["// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."]
          for crate in ['tauri', 'tauri-plugin-shell']:
              if crate not in pkgs: continue
              p = gradle_path(crate)
              proj = proj_map[crate]
              lines.append(f"include ':{proj}'")
              escaped = p.replace('\\\\', '\\\\\\\\').replace('"', '\\\\"')
              lines.append(f"project(':{proj}').projectDir = new File(\"{escaped}\")")
          open('gen/android/tauri.settings.gradle', 'w').write('\n'.join(lines) + '\n')
          gain = [proj_map[c] for c in ['tauri', 'tauri-plugin-shell']]
          build_lines = [
              "// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.",
              "val implementation by configurations",
              "dependencies {",
              '  implementation("androidx.lifecycle:lifecycle-process:2.10.0")',
          ]
          for g in gain:
              build_lines.append(f'  implementation(project(":{g}"))')
          build_lines.append("}")
          os.makedirs('gen/android/app', exist_ok=True)
          open('gen/android/app/tauri.build.gradle.kts', 'w').write('\n'.join(build_lines) + '\n')
          EOF
      - name: Set ABI list
        run: |
          printf '\n' >> src-tauri/gen/android/gradle.properties
          echo 'abiList=arm64-v8a,armeabi-v7a,x86_64' >> src-tauri/gen/android/gradle.properties
      - name: Build Android APK
        run: npx tauri android build
      - name: Sign APKs
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android.keystore
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | head -1)
          BUILD_DIR=src-tauri/gen/android/app/build/outputs/apk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK=$(find "$BUILD_DIR" -path "*$ABI*" -name "*.apk" -type f | head -1)
            if [ -z "$APK" ]; then
              echo "ERROR: No APK found for ABI $ABI under $BUILD_DIR"
              exit 1
            fi
            "$SIGNER" sign \
              --ks android.keystore \
              --ks-key-alias cardduel \
              --ks-pass pass:$ANDROID_SIGNING_PASSWORD \
              --key-pass pass:$ANDROID_SIGNING_PASSWORD \
              --out "CardDuel-Android-$ABI.apk" \
              "$APK"
          done
          rm -f android.keystore
      - uses: actions/upload-artifact@v7
        with:
          name: CardDuel-Android-arm64-v8a
          path: CardDuel-Android-arm64-v8a.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: CardDuel-Android-armeabi-v7a
          path: CardDuel-Android-armeabi-v7a.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: CardDuel-Android-x86_64
          path: CardDuel-Android-x86_64.apk
          archive: false

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [build-web-linux]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: CardDuel-Web-linux
          path: app
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build-web-linux, build-web-win, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CardDuel-Windows/*.exe
            CardDuel-Windows/cardduel.bat
            CardDuel-Android-arm64-v8a.apk
            CardDuel-Android-armeabi-v7a.apk
            CardDuel-Android-x86_64.apk
            CardDuel-Web-linux/card-duel-server
            CardDuel-Web-linux/cardduel.sh
            CardDuel-Web-linux/app/**/*
            CardDuel-Web-win/card-duel-server.exe
            CardDuel-Web-win/cardduel.bat
            CardDuel-Web-win/app/**/*
